<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>INSANITY Calendar</title>
<style>
:root{--bg:#f3f4f6;--card:#fff;--ink:#111827;--muted:#6b7280;--line:#e5e7eb;--accent:#f97316;--green:#16a34a}
*{box-sizing:border-box}body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;background:var(--bg);color:var(--ink)}
.app{max-width:700px;margin:auto;padding:16px 14px 80px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}h1{margin:0 0 4px}.muted{color:var(--muted);font-size:13px}
input{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:12px;font:inherit}button{border:0;border-radius:12px;padding:11px 13px;font-weight:800;cursor:pointer}.primary{background:var(--ink);color:#fff}.row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.metric{background:#f8fafc;padding:10px 6px;border-radius:12px;text-align:center}.metric b{display:block;font-size:20px}
.week{font-weight:900;margin:18px 2px 8px}.week small{display:block;color:var(--muted);font-weight:600;font-size:12px;margin-top:2px}.day{display:grid;grid-template-columns:44px 1fr 54px 36px;gap:9px;align-items:center;padding:12px 0;border-top:1px solid #eee}.day:first-child{border-top:0}.today{background:#fff7ed;margin:0 -8px;padding:12px 8px;border-radius:12px}.name{font-weight:800}.date{font-size:11px;color:var(--muted)}.completedAt{font-size:10px;color:var(--green);font-weight:700;margin-top:3px}.check{width:32px;height:32px;padding:0;border-radius:50%;background:#fff;border:2px solid #cbd5e1}.check.done{background:var(--green);color:#fff;border-color:var(--green)}
.todaycard{border:2px solid #fb923c;background:#fff7ed}.big{font-size:24px;font-weight:900;margin:5px 0}.progress{height:10px;background:#e5e7eb;border-radius:99px;overflow:hidden}.bar{height:100%;background:var(--ink)}.bodybar{background:var(--accent)}
.bodySelect{width:52px;height:38px;padding:4px 2px;border:1px solid #d1d5db;border-radius:10px;background:#fff;font-size:22px;text-align:center}.bodyLabel{font-size:10px;color:var(--muted);text-align:center;margin-bottom:2px}.bodyStamp{font-size:9px;color:var(--muted);text-align:center;margin-top:3px}.bodyToday{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:10px}.bodyBtn{background:#fff;border:2px solid var(--line);font-size:22px;padding:9px 4px}.bodyBtn.on{border-color:var(--accent);background:#fff7ed}.bodyLegend{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;text-align:center;font-size:11px;color:var(--muted);margin-top:5px}
.pulse{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;margin-top:10px}.pulseDay{text-align:center}.pulseDay b{display:block;font-size:11px;margin-bottom:6px}.dots{display:flex;justify-content:center;gap:3px;min-height:12px;flex-wrap:wrap}.dot{width:8px;height:8px;border-radius:50%;background:#cbd5e1}.dot.work{background:var(--green)}.dot.body{background:var(--accent)}.pulseDate{font-size:9px;color:var(--muted);margin-top:4px}.legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:10px;font-size:11px;color:var(--muted)}.legend span:before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}.legend .work:before{background:var(--green)}.legend .body:before{background:var(--accent)}
textarea{width:100%;min-height:90px;padding:12px;border:1px solid #d1d5db;border-radius:12px;font:inherit;box-sizing:border-box}
@media(max-width:520px){.metrics{grid-template-columns:repeat(2,1fr)}.day{grid-template-columns:40px 1fr 50px 34px;gap:6px}.name{font-size:14px}.pulse{gap:4px}.app{padding-left:10px;padding-right:10px}}
</style>
</head>
<body><div class="app">
<h1>🔥 INSANITY Calendar</h1><div class="muted">Classic schedule · phone-friendly tracker</div>
<div class="card"><div class="muted"><b>PROGRAM START DATE</b></div><div class="row"><input id="start" type="date"><button class="primary" id="set">Set</button></div><p class="muted">Set it once. Workout completions and Body updates timestamp themselves automatically.</p></div>
<div id="todayCard" class="card todaycard"></div>
<div class="card"><div class="metrics"><div class="metric"><b id="done">0</b><span class="muted">Completed</span></div><div class="metric"><b id="left">63</b><span class="muted">Left</span></div><div class="metric"><b id="pct">0%</b><span class="muted">Progress</span></div><div class="metric"><b id="bodyPct">—</b><span class="muted">Body Check</span></div></div><div class="muted" style="margin-top:12px"><b>PROGRAM PROGRESS</b></div><div class="progress" style="margin-top:5px"><div id="bar" class="bar" style="width:0"></div></div><div class="muted" style="margin-top:12px"><b>BODY CHECK</b></div><div class="progress" style="margin-top:5px"><div id="bodyBar" class="bar bodybar" style="width:0"></div></div><div class="bodyLegend"><span>😄 Happy</span><span>🙂 OK</span><span>😐 So-so</span><span>😣 Pain</span></div></div>
<div id="pulseCard" class="card"></div>
<div id="calendar"></div>
<div class="card"><h2>Fit Test Notes</h2><textarea id="notes" placeholder="Scores, reps, how it felt..."></textarea><button class="primary" id="saveNotes" style="margin-top:8px;width:100%">Save Notes</button></div>
</div>
<script>
const schedule=[["Week 1","Fit Test"],["Week 1","Plyometric Cardio Circuit"],["Week 1","Cardio Power & Resistance"],["Week 1","Cardio Recovery"],["Week 1","Pure Cardio"],["Week 1","Plyometric Cardio Circuit"],["Week 1","Rest Day"],["Week 2","Cardio Power & Resistance"],["Week 2","Pure Cardio"],["Week 2","Plyometric Cardio Circuit"],["Week 2","Cardio Recovery"],["Week 2","Cardio Power & Resistance"],["Week 2","Pure Cardio + Cardio Abs"],["Week 2","Rest Day"],["Week 3","Fit Test"],["Week 3","Plyometric Cardio Circuit"],["Week 3","Pure Cardio + Cardio Abs"],["Week 3","Cardio Recovery"],["Week 3","Cardio Power & Resistance"],["Week 3","Plyometric Cardio Circuit"],["Week 3","Rest Day"],["Week 4","Pure Cardio + Cardio Abs"],["Week 4","Cardio Power & Resistance"],["Week 4","Plyometric Cardio Circuit"],["Week 4","Cardio Recovery"],["Week 4","Pure Cardio + Cardio Abs"],["Week 4","Plyometric Cardio Circuit"],["Week 4","Rest Day"],["Recovery Week","Core Cardio & Balance"],["Recovery Week","Core Cardio & Balance"],["Recovery Week","Core Cardio & Balance"],["Recovery Week","Core Cardio & Balance"],["Recovery Week","Core Cardio & Balance"],["Recovery Week","Core Cardio & Balance"],["Recovery Week","Rest Day"],["Week 6","Fit Test + MAX Interval Circuit"],["Week 6","MAX Interval Plyo"],["Week 6","MAX Cardio Conditioning"],["Week 6","MAX Recovery"],["Week 6","MAX Interval Circuit"],["Week 6","MAX Interval Plyo"],["Week 6","Rest Day"],["Week 7","MAX Cardio Conditioning"],["Week 7","MAX Interval Circuit"],["Week 7","MAX Interval Plyo"],["Week 7","MAX Recovery"],["Week 7","MAX Cardio Conditioning + Cardio Abs"],["Week 7","Core Cardio & Balance"],["Week 7","Rest Day"],["Week 8","Fit Test + MAX Interval Circuit"],["Week 8","MAX Interval Plyo"],["Week 8","MAX Cardio Conditioning + Cardio Abs"],["Week 8","MAX Recovery"],["Week 8","MAX Interval Circuit"],["Week 8","Core Cardio & Balance"],["Week 8","Rest Day"],["Week 9","MAX Interval Plyo"],["Week 9","MAX Cardio Conditioning + Cardio Abs"],["Week 9","MAX Interval Circuit"],["Week 9","Core Cardio & Balance"],["Week 9","MAX Interval Plyo"],["Week 9","MAX Cardio Conditioning + Cardio Abs"],["Week 9","Fit Test"]];
const KEY='insanity_calendar_v1';
const BODY={happy:{emoji:'😄',label:'Happy',score:100},ok:{emoji:'🙂',label:'OK',score:75},soso:{emoji:'😐',label:'So-so',score:50},pain:{emoji:'😣',label:'In pain',score:25}};
let state={start:null,done:{},body:{},notes:'',completionEvents:[],bodyEvents:[],startedAt:null};
try{Object.assign(state,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){}
state.done=state.done||{};state.body=state.body||{};state.completionEvents=state.completionEvents||[];state.bodyEvents=state.bodyEvents||[];
const $=x=>document.getElementById(x),save=()=>localStorage.setItem(KEY,JSON.stringify(state));
function pd(s){let [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}
function dateFor(i){if(!state.start)return null;let d=pd(state.start);d.setDate(d.getDate()+i);return d}
function fmt(d){return d.toLocaleDateString(undefined,{month:'short',day:'numeric'})}
function fmtRange(a,b){if(!a||!b)return'';return `${a.toLocaleDateString(undefined,{month:'short',day:'numeric'})} – ${b.toLocaleDateString(undefined,{month:'short',day:'numeric'})}`}
function fmtCompleted(iso){if(!iso)return'';let d=new Date(iso);return d.toLocaleDateString(undefined,{weekday:'short'})+' · '+d.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'})}
function fmtShortTime(iso){if(!iso)return'';let d=new Date(iso);return d.toLocaleDateString(undefined,{weekday:'short'})+' '+d.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'})}
function ti(){if(!state.start)return-1;let a=pd(state.start),b=new Date();b=new Date(b.getFullYear(),b.getMonth(),b.getDate());return Math.round((b-a)/86400000)}
function activeCompletion(i){for(let n=state.completionEvents.length-1;n>=0;n--){let e=state.completionEvents[n];if(e.dayIndex===i)return e.action==='complete'?e:null}return state.done[i]?{at:null}:null}
function latestBodyEvent(i){for(let n=state.bodyEvents.length-1;n>=0;n--){let e=state.bodyEvents[n];if(e.dayIndex===i)return e}return null}
function bodyAverage(){let vals=Object.values(state.body).map(k=>BODY[k]?.score).filter(Number.isFinite);return vals.length?Math.round(vals.reduce((a,b)=>a+b,0)/vals.length):null}
function bodyOptions(i){let e=latestBodyEvent(i);return `<select class="bodySelect" aria-label="Body Check workout ${i+1}" data-body="${i}"><option value="">—</option>${Object.entries(BODY).map(([k,v])=>`<option value="${k}" ${state.body[i]===k?'selected':''}>${v.emoji}</option>`).join('')}</select>${e?`<div class="bodyStamp">${fmtShortTime(e.at)}</div>`:''}`}
function todayBody(i){let e=latestBodyEvent(i);return `<div class="muted" style="margin-top:12px"><b>BODY CHECK</b></div><div class="bodyToday">${Object.entries(BODY).map(([k,v])=>`<button class="bodyBtn ${state.body[i]===k?'on':''}" data-today-body="${k}" title="${v.label}">${v.emoji}</button>`).join('')}</div><div class="bodyLegend"><span>Happy</span><span>OK</span><span>So-so</span><span>In pain</span></div>${e?`<div class="muted" style="margin-top:8px">Updated ${fmtShortTime(e.at)}</div>`:''}`}
function weekBounds(label){let idx=schedule.findIndex(x=>x[0]===label);if(idx<0)return[null,null];let end=idx;while(end+1<schedule.length&&schedule[end+1][0]===label)end++;return[dateFor(idx),dateFor(end)]}
function sameLocalDay(iso,d){if(!iso||!d)return false;let x=new Date(iso);return x.getFullYear()===d.getFullYear()&&x.getMonth()===d.getMonth()&&x.getDate()===d.getDate()}
function renderPulse(){let t=ti(),startIndex=t>=0?Math.floor(t/7)*7:0;if(startIndex>56)startIndex=56;let days=[];for(let j=0;j<7&&startIndex+j<schedule.length;j++){let d=dateFor(startIndex+j),work=state.completionEvents.filter(e=>e.action==='complete'&&sameLocalDay(e.at,d)).length,body=state.bodyEvents.filter(e=>sameLocalDay(e.at,d)).length;let marks='';for(let n=0;n<work;n++)marks+='<span class="dot work"></span>';for(let n=0;n<body;n++)marks+='<span class="dot body"></span>';if(!marks)marks='<span class="dot"></span>';days.push(`<div class="pulseDay"><b>${d?d.toLocaleDateString(undefined,{weekday:'short'}):'—'}</b><div class="dots">${marks}</div><div class="pulseDate">${d?fmt(d):''}</div></div>`)}$('pulseCard').innerHTML=`<div class="muted"><b>WEEK PULSE · ACTUAL ACTIVITY</b></div><div class="pulse">${days.join('')}</div><div class="legend"><span class="work">Workout completed</span><span class="body">Body updated</span></div>`}
function render(){
 $('start').value=state.start||'';$('notes').value=state.notes||'';let t=ti(),x=schedule[t],ce=t>=0?activeCompletion(t):null;
 $('todayCard').innerHTML=x?`<div class="muted"><b>TODAY · WORKOUT #${t+1}</b></div><div class="big">${x[1]}</div><div class="muted">${x[0]}${dateFor(t)?' · '+fmt(dateFor(t)):''}</div>${todayBody(t)}<button class="primary" id="todayComplete" style="margin-top:12px;width:100%">${ce?'Mark Incomplete':'Complete Workout ✓'}</button>${ce?.at?`<div class="muted" style="margin-top:8px;text-align:center">Completed ${fmtCompleted(ce.at)}</div>`:''}`:`<div class="big">${state.start?'No scheduled workout today':'Choose your start date'}</div>`;
 let h='',w='';schedule.forEach((x,i)=>{if(x[0]!==w){if(w)h+='</div>';w=x[0];let [ws,we]=weekBounds(w);h+=`<div class="week">${w}${ws?`<small>${fmtRange(ws,we)}</small>`:''}</div><div class="card">`}let d=dateFor(i),c=activeCompletion(i);h+=`<div class="day ${i===t?'today':''}"><div><b>#${i+1}</b><div class="date">${d?fmt(d):''}</div>${c?.at?`<div class="completedAt">✓ ${fmtCompleted(c.at)}</div>`:''}</div><div class="name">${x[1]}</div><div><div class="bodyLabel">BODY</div>${bodyOptions(i)}</div><button class="check ${c?'done':''}" data-toggle="${i}" aria-label="${c?'Mark workout incomplete':'Complete workout'} ${i+1}">${c?'✓':''}</button></div>`});if(w)h+='</div>';$('calendar').innerHTML=h;
 let n=Object.keys(state.done).filter(k=>state.done[k]).length,p=Math.round(n/schedule.length*100),bp=bodyAverage();$('done').textContent=n;$('left').textContent=schedule.length-n;$('pct').textContent=p+'%';$('bar').style.width=p+'%';$('bodyPct').textContent=bp===null?'—':bp+'%';$('bodyBar').style.width=(bp||0)+'%';renderPulse();bindDynamic();
}
function toggle(i){let now=new Date().toISOString(),currently=!!activeCompletion(i);state.done[i]=!currently;state.completionEvents.push({dayIndex:i,workoutNumber:i+1,week:schedule[i][0],workout:schedule[i][1],action:currently?'incomplete':'complete',at:now});save();render()}
function setBody(i,v){let old=state.body[i]||null;if(v)state.body[i]=v;else delete state.body[i];if(v!==old)state.bodyEvents.push({dayIndex:i,workoutNumber:i+1,week:schedule[i][0],value:v||null,previous:old,at:new Date().toISOString()});save();render()}
function bindDynamic(){document.querySelectorAll('[data-toggle]').forEach(b=>b.addEventListener('click',()=>toggle(Number(b.dataset.toggle))));document.querySelectorAll('[data-body]').forEach(s=>s.addEventListener('change',()=>setBody(Number(s.dataset.body),s.value)));document.querySelectorAll('[data-today-body]').forEach(b=>b.addEventListener('click',()=>{let t=ti();if(t>=0)setBody(t,b.dataset.todayBody)}));let tc=$('todayComplete');if(tc)tc.addEventListener('click',()=>{let t=ti();if(t>=0)toggle(t)})}
$('set').addEventListener('click',()=>{if($('start').value){state.start=$('start').value;if(!state.startedAt)state.startedAt=new Date().toISOString();save();render()}});
$('saveNotes').addEventListener('click',()=>{state.notes=$('notes').value;save()});
render();
</script></body></html>
