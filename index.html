<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>INSANITY Calendar</title>
<style>
body{font-family:system-ui;margin:0;background:#f3f4f6;color:#111827}.app{max-width:700px;margin:auto;padding:16px 14px 80px}.card{background:white;border:1px solid #e5e7eb;border-radius:18px;padding:16px;margin-bottom:12px}h1{margin:0 0 4px}.muted{color:#6b7280;font-size:13px}input{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:12px;font:inherit}button{border:0;border-radius:12px;padding:11px 13px;font-weight:800}.primary{background:#111827;color:white}.row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.metric{background:#f8fafc;padding:10px 6px;border-radius:12px;text-align:center}.metric b{display:block;font-size:20px}.week{font-weight:900;margin:18px 2px 8px}.day{display:grid;grid-template-columns:44px 1fr 48px 34px;gap:9px;align-items:center;padding:12px 0;border-top:1px solid #eee}.day:first-child{border-top:0}.today{background:#fff7ed;margin:0 -8px;padding:12px 8px;border-radius:12px}.name{font-weight:800}.date{font-size:11px;color:#6b7280}.check{width:32px;height:32px;padding:0;border-radius:50%;background:white;border:2px solid #cbd5e1}.check.done{background:#16a34a;color:white;border-color:#16a34a}.todaycard{border:2px solid #fb923c;background:#fff7ed}.big{font-size:24px;font-weight:900;margin:5px 0}.progress{height:10px;background:#e5e7eb;border-radius:99px;overflow:hidden}.bar{height:100%;background:#111827}.bodybar{background:#f97316}.bodySelect{width:48px;height:38px;padding:4px 2px;border:1px solid #d1d5db;border-radius:10px;background:#fff;font-size:22px;text-align:center}.bodyLabel{font-size:10px;color:#6b7280;text-align:center;margin-bottom:2px}.bodyToday{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:10px}.bodyBtn{background:#fff;border:2px solid #e5e7eb;font-size:22px;padding:9px 4px}.bodyBtn.on{border-color:#f97316;background:#fff7ed}.bodyLegend{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;text-align:center;font-size:11px;color:#6b7280;margin-top:5px}textarea{width:100%;min-height:90px;padding:12px;border:1px solid #d1d5db;border-radius:12px;font:inherit;box-sizing:border-box}@media(max-width:520px){.metrics{grid-template-columns:repeat(2,1fr)}.day{grid-template-columns:40px 1fr 46px 32px;gap:6px}.name{font-size:14px}}
</style></head><body><div class="app">
<h1>🔥 INSANITY Calendar</h1><div class="muted">Classic schedule · phone-friendly tracker</div>
<div class="card"><div class="muted"><b>PROGRAM START DATE</b></div><div class="row"><input id="start" type="date"><button class="primary" id="set">Set</button></div><p class="muted">Progress and Body Check are saved on this device.</p></div>
<div id="todayCard" class="card todaycard"></div>
<div class="card"><div class="metrics"><div class="metric"><b id="done">0</b><span class="muted">Completed</span></div><div class="metric"><b id="left">63</b><span class="muted">Days Left</span></div><div class="metric"><b id="pct">0%</b><span class="muted">Progress</span></div><div class="metric"><b id="bodyPct">—</b><span class="muted">Body Check</span></div></div><div class="muted" style="margin-top:12px"><b>PROGRAM PROGRESS</b></div><div class="progress" style="margin-top:5px"><div id="bar" class="bar" style="width:0"></div></div><div class="muted" style="margin-top:12px"><b>BODY CHECK</b></div><div class="progress" style="margin-top:5px"><div id="bodyBar" class="bar bodybar" style="width:0"></div></div><div class="bodyLegend"><span>😄 Happy</span><span>🙂 OK</span><span>😐 So-so</span><span>😣 Pain</span></div></div>
<div id="calendar"></div>
<div class="card"><h2>Fit Test Notes</h2><textarea id="notes" placeholder="Scores, reps, how it felt..."></textarea><button class="primary" id="saveNotes" style="margin-top:8px;width:100%">Save Notes</button></div>
</div>
<script>
const schedule=[["Week 1", "Fit Test"], ["Week 1", "Plyometric Cardio Circuit"], ["Week 1", "Cardio Power & Resistance"], ["Week 1", "Cardio Recovery"], ["Week 1", "Pure Cardio"], ["Week 1", "Plyometric Cardio Circuit"], ["Week 1", "Rest Day"], ["Week 2", "Cardio Power & Resistance"], ["Week 2", "Pure Cardio"], ["Week 2", "Plyometric Cardio Circuit"], ["Week 2", "Cardio Recovery"], ["Week 2", "Cardio Power & Resistance"], ["Week 2", "Pure Cardio + Cardio Abs"], ["Week 2", "Rest Day"], ["Week 3", "Fit Test"], ["Week 3", "Plyometric Cardio Circuit"], ["Week 3", "Pure Cardio + Cardio Abs"], ["Week 3", "Cardio Recovery"], ["Week 3", "Cardio Power & Resistance"], ["Week 3", "Plyometric Cardio Circuit"], ["Week 3", "Rest Day"], ["Week 4", "Pure Cardio + Cardio Abs"], ["Week 4", "Cardio Power & Resistance"], ["Week 4", "Plyometric Cardio Circuit"], ["Week 4", "Cardio Recovery"], ["Week 4", "Pure Cardio + Cardio Abs"], ["Week 4", "Plyometric Cardio Circuit"], ["Week 4", "Rest Day"], ["Recovery Week", "Core Cardio & Balance"], ["Recovery Week", "Core Cardio & Balance"], ["Recovery Week", "Core Cardio & Balance"], ["Recovery Week", "Core Cardio & Balance"], ["Recovery Week", "Core Cardio & Balance"], ["Recovery Week", "Core Cardio & Balance"], ["Recovery Week", "Rest Day"], ["Week 6", "Fit Test + MAX Interval Circuit"], ["Week 6", "MAX Interval Plyo"], ["Week 6", "MAX Cardio Conditioning"], ["Week 6", "MAX Recovery"], ["Week 6", "MAX Interval Circuit"], ["Week 6", "MAX Interval Plyo"], ["Week 6", "Rest Day"], ["Week 7", "MAX Cardio Conditioning"], ["Week 7", "MAX Interval Circuit"], ["Week 7", "MAX Interval Plyo"], ["Week 7", "MAX Recovery"], ["Week 7", "MAX Cardio Conditioning + Cardio Abs"], ["Week 7", "Core Cardio & Balance"], ["Week 7", "Rest Day"], ["Week 8", "Fit Test + MAX Interval Circuit"], ["Week 8", "MAX Interval Plyo"], ["Week 8", "MAX Cardio Conditioning + Cardio Abs"], ["Week 8", "MAX Recovery"], ["Week 8", "MAX Interval Circuit"], ["Week 8", "Core Cardio & Balance"], ["Week 8", "Rest Day"], ["Week 9", "MAX Interval Plyo"], ["Week 9", "MAX Cardio Conditioning + Cardio Abs"], ["Week 9", "MAX Interval Circuit"], ["Week 9", "Core Cardio & Balance"], ["Week 9", "MAX Interval Plyo"], ["Week 9", "MAX Cardio Conditioning + Cardio Abs"], ["Week 9", "Fit Test"]], KEY='insanity_calendar_v1';
const BODY={happy:{emoji:'😄',label:'Happy',score:100},ok:{emoji:'🙂',label:'OK',score:75},soso:{emoji:'😐',label:'So-so',score:50},pain:{emoji:'😣',label:'In pain',score:25}};
let state={start:null,done:{},body:{},notes:''};try{Object.assign(state,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){};state.done=state.done||{};state.body=state.body||{};
const $=x=>document.getElementById(x),save=()=>localStorage.setItem(KEY,JSON.stringify(state));
function pd(s){let [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}function dateFor(i){if(!state.start)return null;let d=pd(state.start);d.setDate(d.getDate()+i);return d}function fmt(d){return d.toLocaleDateString(undefined,{month:'short',day:'numeric'})}function ti(){if(!state.start)return-1;let a=pd(state.start),b=new Date();b=new Date(b.getFullYear(),b.getMonth(),b.getDate());return Math.round((b-a)/86400000)}
function bodyAverage(){let vals=Object.values(state.body).map(k=>BODY[k]?.score).filter(v=>Number.isFinite(v));return vals.length?Math.round(vals.reduce((a,b)=>a+b,0)/vals.length):null}
function bodyOptions(i){return `<select class="bodySelect" aria-label="Body Check day ${i+1}" onchange="setBody(${i},this.value)"><option value="">—</option>${Object.entries(BODY).map(([k,v])=>`<option value="${k}" ${state.body[i]===k?'selected':''}>${v.emoji}</option>`).join('')}</select>`}
function todayBody(i){return `<div class="muted" style="margin-top:12px"><b>BODY CHECK</b></div><div class="bodyToday">${Object.entries(BODY).map(([k,v])=>`<button class="bodyBtn ${state.body[i]===k?'on':''}" onclick="setBody(${i},'${k}')" title="${v.label}">${v.emoji}</button>`).join('')}</div><div class="bodyLegend"><span>Happy</span><span>OK</span><span>So-so</span><span>In pain</span></div>`}
function render(){$('start').value=state.start||'';$('notes').value=state.notes||'';let t=ti(),x=schedule[t];$('todayCard').innerHTML=x?`<div class="muted"><b>TODAY · DAY ${t+1}</b></div><div class="big">${x[1]}</div><div class="muted">${x[0]}</div>${todayBody(t)}<button class="primary" style="margin-top:12px;width:100%" onclick="toggle(${t})">${state.done[t]?'Mark Incomplete':'Complete Today ✓'}</button>`:`<div class="big">${state.start?'No scheduled workout today':'Choose your start date'}</div>`;
let h='',w='';schedule.forEach((x,i)=>{if(x[0]!==w){if(w)h+='</div>';w=x[0];h+=`<div class="week">${w}</div><div class="card">`}let d=dateFor(i);h+=`<div class="day ${i===t?'today':''}"><div><b>${i+1}</b><div class="date">${d?fmt(d):''}</div></div><div class="name">${x[1]}</div><div><div class="bodyLabel">BODY</div>${bodyOptions(i)}</div><button class="check ${state.done[i]?'done':''}" onclick="toggle(${i})">${state.done[i]?'✓':''}</button></div>`});if(w)h+='</div>';$('calendar').innerHTML=h;
let n=Object.values(state.done).filter(Boolean).length,p=Math.round(n/schedule.length*100),bp=bodyAverage();$('done').textContent=n;$('left').textContent=schedule.length-n;$('pct').textContent=p+'%';$('bar').style.width=p+'%';$('bodyPct').textContent=bp===null?'—':bp+'%';$('bodyBar').style.width=(bp||0)+'%'}
window.toggle=i=>{state.done[i]=!state.done[i];save();render()};window.setBody=(i,v)=>{if(v)state.body[i]=v;else delete state.body[i];save();render()};$('set').onclick=()=>{if($('start').value){state.start=$('start').value;save();render()}};$('saveNotes').onclick=()=>{state.notes=$('notes').value;save();};render();
</script></body></html>
